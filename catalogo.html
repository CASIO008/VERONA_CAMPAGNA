<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100E0B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Catálogo — Verona Campagna Gioielli</title>
  <meta name="description" content="Explore todas as joias Verona Campagna: anéis, brincos, colares, pingentes e pulseiras em prata 925 e banho de ouro 18k. Preços de varejo e atacado.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VERONA CAMPAGNA">
  <meta property="og:title" content="Catálogo — Verona Campagna">
  <meta property="og:description" content="Anéis, brincos, colares, pingentes e pulseiras em prata 925 e banho de ouro 18k.">
  <meta property="og:image" content="images/editorial/modelo-1.jpg">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var r = document.documentElement;
        var t = localStorage.getItem('vc_theme');
        if (t === 'dark' || t === 'light') r.dataset.theme = t;
        else r.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (localStorage.getItem('vc_intro_v1') === '1') r.classList.add('cached');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body data-page="catalogo">
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <div id="siteHeader"></div>

  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="crumbs"><a href="index.html">Início</a><span>Catálogo</span></p>
        <p class="eyebrow" id="catEyebrow">Todas as joias</p>
        <h1 id="catTitle">Catálogo</h1>
        <p class="page-sub" id="catSub">Prata 925 maciça e banho de ouro 18k, feitos à mão em pequenos lotes. Ative o modo atacado no topo para ver os preços de revenda.</p>
      </div>
    </section>

    <div class="cat-toolbar">
      <div class="wrap cat-toolbar-inner">
        <div class="filters" id="filters" role="group" aria-label="Filtrar por categoria">
          <button class="chip is-active" data-filter="all" type="button">Todas</button>
          <button class="chip" data-filter="aneis" type="button">Anéis</button>
          <button class="chip" data-filter="brincos" type="button">Brincos</button>
          <button class="chip" data-filter="colares" type="button">Colares</button>
          <button class="chip" data-filter="pingentes" type="button">Pingentes</button>
          <button class="chip" data-filter="pulseiras" type="button">Pulseiras</button>
        </div>
        <div class="collection-right">
          <span class="cat-count" id="catCount"></span>
          <label class="sort-wrap">
            <span class="sort-label">Ordenar</span>
            <select class="sort-select" id="sortSelect" aria-label="Ordenar joias">
              <option value="relevancia">Relevância</option>
              <option value="novidades">Novidades</option>
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <section class="cat-section">
      <div class="wrap">
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
  <div id="siteDrawers"></div>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span></span></div>

  <script src="data.js"></script>
  <script src="theme.js"></script>
  <script src="pages.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="motion.js"></script>
</body>
</html>
