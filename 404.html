<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100E0B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Página não encontrada — Verona Campagna</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var r = document.documentElement;
        var t = localStorage.getItem('vc_theme');
        if (t === 'dark' || t === 'light') r.dataset.theme = t;
        else r.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (localStorage.getItem('vc_intro_v1') === '1') r.classList.add('cached');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="404">
  <div id="siteHeader"></div>
  <main id="main">
    <section class="notfound" style="min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:90px 24px">
      <p class="serif" style="font-size:clamp(5rem,16vw,10rem);line-height:.9;color:var(--gold-soft)">404</p>
      <h1 class="serif" style="font-size:clamp(1.6rem,3vw,2.4rem)">Essa joia não está mais na vitrine</h1>
      <p style="color:var(--ink-2);max-width:460px">A página que você procurou saiu de linha — mas o ateliê está aberto. Volte ao início ou explore o catálogo completo.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px">
        <a class="btn btn-dark" href="index.html">Voltar ao início</a>
        <a class="btn btn-ghost" href="catalogo.html">Ver catálogo</a>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <div id="siteDrawers"></div>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span></span></div>

  <script src="data.js"></script>
  <script src="theme.js"></script>
</body>
</html>
